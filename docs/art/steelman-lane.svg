<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of one adversarial steelman: claim, agents, sources, retrieval, maturity, excluded, verdict, and gap. Each run begins by building the strongest honest version of an industry claim rather than the weakest. Four parallel web-grounded searches run against it, roughly two hundred tool calls apiece. Between sixty and eighty-five sources survive deduplication in a given run. Every citation is checked against a primary or reputable record before it is used. The method names eight maturity labels, from peer-reviewed through preprint, standard, gov, primary-legal, incident, gray-lit, and data, and all five runs carry them inline. Anything that could not be confirmed is marked unverified in place and excluded from load-bearing use, which is why several named figures appear in the runs only as things that were dropped. The verdict is stated as partial or false as stated, with the reason attached. What remains is the gap: the named distance between an artifact that looks verified and the property it was taken to warrant. Three outcomes: partial, false as stated, and an open bid."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE CLAIM, ARGUED AND THEN BROKEN</text><text class="h" x="44" y="72">How an industry claim becomes a verdict with a named gap</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">THE CASE IS BUILT BEFORE IT IS TESTED</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">AN UNVERIFIED SOURCE CARRIES NO WEIGHT</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Claim</text><text class="s" x="58" y="168">The strongest honest version,</text><text class="s" x="58" y="183">built first.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Agents</text><text class="s" x="282.5" y="168">Four parallel searches against</text><text class="s" x="282.5" y="183">that case.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Sources</text><text class="s" x="507" y="168">Sixty to eighty-five per run,</text><text class="s" x="507" y="183">deduplicated.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Retrieval</text><text class="s" x="731.5" y="168">Each citation checked against</text><text class="s" x="731.5" y="183">a record.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Maturity</text><text class="s" x="58" y="360">Eight labels, peer-reviewed</text><text class="s" x="58" y="375">down to data.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Excluded</text><text class="s" x="282.5" y="360">What did not confirm is marked</text><text class="s" x="282.5" y="375">and dropped.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Verdict</text><text class="s" x="507" y="360">Partial, or false as stated,</text><text class="s" x="507" y="375">with a reason.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Gap</text><text class="s" x="731.5" y="360">The distance between artifact</text><text class="s" x="731.5" y="375">and property.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">PARTIAL</text><text class="s" x="58" y="509" font-size="10.5">one claim held, then failed at proof</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">FALSE AS STATED</text><text class="s" x="357.33" y="509" font-size="10.5">four claims broke against the record</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">AN OPEN BID</text><text class="s" x="656.67" y="509" font-size="10.5">the convergence is not yet a proof</text><text class="s" x="44" y="546">A steelman that only looks for weakness is a straw man wearing better clothes. Each run builds the strongest honest case for the claim first, and the verdict is whatever survives that construction.</text></svg>
